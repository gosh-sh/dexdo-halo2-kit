[package]
name = "dex-halo2-circuit"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gen_hermez_kzg_and_dark_dex_keys"
path = "src/bin/gen_hermez_kzg_and_dark_dex_keys.rs"

[[bin]]
name = "gen_legacy_gen_srs_dark_dex_keys"
path = "src/bin/gen_legacy_gen_srs_dark_dex_keys.rs"

[dependencies]
gosh-sha256-chip = { git = "https://github.com/gosh-sh/gosh-halo2-crypto-lib", branch = "bump-halo2-lib-v0.4.1" }
gosh-dense-balanced-tree = { git = "https://github.com/gosh-sh/gosh-halo2-crypto-lib", branch = "bump-halo2-lib-v0.4.1" }
halo2-ecc = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1", default-features = false, features = ["halo2-axiom"] }
# `test-utils` gives us gen_proof_with_instances / check_proof_with_instances,
# used both by the `keygen` module round-trip helpers and the hermez bin.
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1", default-features = false, features = ["halo2-axiom", "test-utils"] }
tvm_types = { git = "https://github.com/tvmlabs/tvm-sdk", package = "tvm_types" }
tvm_block = { git = "https://github.com/tvmlabs/tvm-sdk", package = "tvm_block" }
failure = "0.1"

sha2 = "0.10"
hex = "0.4.3"
rand = "0.8"

itertools = "0.11"
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


pse-poseidon = { git = "https://github.com/axiom-crypto/pse-poseidon.git" }

# Needed by `src/keygen.rs`:
#  - `dense-balanced-tree` provides the native Merkle proof/root helpers used to
#    synthesize W=128 two-level trees + dense chains.
#  - `gosh-zk-snark-halo2-utils` provides Hermez ptau read/verify + rust-const
#    emission used by `bin/gen_hermez_kzg_and_vk.rs`.
dense-balanced-tree = { git = "https://github.com/gosh-sh/dense-balanced-tree" }
gosh-zk-snark-halo2-utils = { git = "https://github.com/gosh-sh/gosh-zk-snark-halo2-utils", branch = "main" }

# `gen_hermez_kzg_and_vk` bin-only deps:
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
