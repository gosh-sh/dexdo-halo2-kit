[package]
name = "dark_dex_halo2_private_witness_export_lib"
version = "0.1.0"
edition = "2021"

[lib]
name = "dark_dex_halo2_private_witness_export_lib"
path = "src/lib.rs"

[[bin]]
name = "dex_data_exporter"
path = "src/main.rs"

[dependencies]
# Poseidon-bn254 hashing (same crates the node uses → byte-identical roots).
# History-proof code (Poseidon dense-tree helpers, layer-N walk) is
# vendored locally in src/poseidon.rs; the depth-4 SHA block-id tree
# and L7 Poseidon refs-root helpers live in the sibling circuit crate
# and are consumed directly — no acki-nacki dep and no duplicate vendor.
pse-poseidon = { git = "https://github.com/axiom-crypto/pse-poseidon.git" }
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1", default-features = false, features = ["halo2-axiom"] }
dex-halo2-circuit = { path = "../dex-halo2-circuit" }
# Byte↔Fr canonical converters used by the bundle-witness chain walker.
# Kept via the same source as dex-halo2-circuit so byte-flat Poseidon
# inputs stay bit-identical to what the in-circuit gadget consumes.
gosh-dense-balanced-tree = { git = "https://github.com/gosh-sh/gosh-halo2-crypto-lib", branch = "bump-halo2-lib-v0.4.1" }

anyhow = "1.0.97"
clap = { version = "4.5.2", features = ["derive"] }
hex = "0.4.3"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
tokio = { version = "1.44.2", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
typed-builder = "0.20.0"

[target.'cfg(not(target_os = "windows"))'.dependencies]
sha2 = { version = "0.10.8", features = ["asm"] }

[target.'cfg(target_os = "windows")'.dependencies]
sha2 = "0.10.8"
